<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Explore the Evidence: ten-minute route map</title>
<desc id="desc">Seven stops through the original HQ records. 01 Design intent, HQ Campus Design. 02 Phase verification, Verification Plan HQ-VP-09.02. 03 Test plan, Phase 10 Test Plan. 04 Results, Phase 10 results index. 05 Report and CLI, HQ-VP-10.02 to 10.03 report and original CLI. 06 Engineering review, Layer 2 isolation HQ-VP-10.08. 07 Acceptance, Phase 11 final acceptance. Green rings mark the alternate routing that worked (stops 01, 02 and 05); red rings mark the Layer 2 isolation that failed (stops 04, 06 and 07). After stop 07 the route offers the optional Test Investigations, the interactive portfolio, or a choice of another route.</desc>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .title { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; fill: #f0f6fc; }
  .subtitle { font-size: 14.5px; font-weight: 400; fill: #9198a1; }
  .name { font-size: 15px; font-weight: 600; fill: #f0f6fc; }
  .detail { font-size: 13.5px; font-weight: 400; fill: #9198a1; }
  .legend { font-size: 13.5px; font-weight: 400; fill: #9198a1; }
</style>
