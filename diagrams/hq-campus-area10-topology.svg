<svg xmlns="http://www.w3.org/2000/svg" width="920" height="688" viewBox="0 0 920 688" role="img" aria-labelledby="title desc">
<title id="title">HQ Campus — OSPF Area 10: high-level topology</title>
<desc id="desc">Edge routers hq-r1 and hq-r2 each connect to distribution switches hq-d1 and hq-d2 over four /31 routed links with ECMP, plus higher-cost /31 cross-links (hq-r1 to hq-d2, hq-r2 to hq-d1) as alternate paths; all four devices are in OSPF Area 10. hq-d1 and hq-d2 are joined by Po30 and connect to access switch hq-a1 by Po10 and Po20, all 802.1Q trunks using LACP. A future Area 0 inter-site backbone will attach to both edge routers.</desc>
