<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1066" viewBox="0 0 1100 1066" role="img" aria-labelledby="title desc">
<title id="title">Physical network topology: infrastructure for the multi-site CML lab</title>
<desc id="desc">Internet to the ISP, fibre (FTTP) to the ONT, then Ethernet WAN to the ASUS RT-BE92U primary router and gateway. The router connects CML Server 1 (laptop) and a Raspberry Pi 5 network automation server over 1 GbE, and an ASUS TUF BE9400 AiMesh node over a 6 GHz Wi-Fi 7 (IEEE 802.11be) wireless backhaul. The AiMesh node connects CML Server 2 (desktop) over 2.5 GbE.</desc>
